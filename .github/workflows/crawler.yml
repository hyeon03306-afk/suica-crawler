name: Suica Crawler Auto Update

on:
  schedule:
    - cron: '0 * * * *' # 매시간 정각(0분)마다 1시간 간격으로 실행
  workflow_dispatch: # 수동으로 버튼 눌러서 실행 가능하게 해주는 옵션

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 챙기기
        uses: actions/checkout@v3
        
      - name: 파이썬(Python) 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 크롤링 부품(라이브러리) 조립
        run: |
          pip install requests beautifulsoup4 firebase-admin deep-translator
          
      # 1번 타자: 세븐일레븐 
      - name: 세븐일레븐 크롤러 봇 출동!
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }} # ⬅️ 추가!
        run: python crawler.py

      # 2번 타자: 로손
      - name: 로손 전용 크롤러 봇 출동!
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }} # ⬅️ 추가!
        run: python lawson_crawler.py

      # 3번 타자: 패밀리마트
      - name: 패밀리마트 전용 크롤러 봇 출동!
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }} # ⬅️ (이미 있던 것)
        run: python family_crawler.py

        # 🍦 4번 타자: 미니스톱 (새로 추가됨!)
      - name: 미니스톱 전용 크롤러 봇 출동!
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: python ministop_crawler.py
