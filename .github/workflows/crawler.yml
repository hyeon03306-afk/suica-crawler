name: Suica Crawler Auto Update

on:
  schedule:
    - cron: '0 * * * *' # 매시간 정각(0분)마다 1시간 간격으로 실행
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 챙기기
        uses: actions/checkout@v3
        
      - name: 파이썬(Python) 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 크롤링 부품(라이브러리) 조립
        run: |
          pip install requests beautifulsoup4 firebase-admin deep-translator
          
      - name: 세븐일레븐(및 기타) 크롤러 봇 출동!
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python crawler.py

      - name: 로손 전용 크롤러 봇 출동!
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python lawson_crawler.py
